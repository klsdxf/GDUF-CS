server {
    listen 80;
    server_name __PUBLIC_IP__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        return 503 "HTTPS setup is in progress.\n";
    }
}
