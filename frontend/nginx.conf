server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 5m;
    include /etc/nginx/snippets/security-headers.conf;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-store always;
    }
    location ^~ /media/ { proxy_pass http://api:8000; proxy_hide_header X-Content-Type-Options; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    location /redesign/ { try_files $uri =404; }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control no-cache always;
    }
    location = /404.html { internal; }
    location = /503.html { internal; }
    location = /_page_check {
        internal;
        proxy_pass http://api:8000/internal/page-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location ~ ^/admin(?:/.*)?$ { try_files $uri /index.html; }
    location ~ ^/(?:competitions|announcements)?$ { try_files $uri /index.html; }
    # Generated from the build mode; no database access in demo mode.
    __RESOURCE_LOCATION__
    location ~ \.[a-zA-Z0-9]+$ { try_files $uri =404; }
    location / { return 404; }
    error_page 404 /404.html;
}
