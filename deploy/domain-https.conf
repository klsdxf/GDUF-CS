server {
    listen 80;
    server_name __DOMAIN__ __REDIRECT_HOSTS__;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/gduf-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gduf-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    client_max_body_size 5m;
    location / {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Optional redirect server, emitted only when redirect hosts were supplied.
__REDIRECT_SERVER__
