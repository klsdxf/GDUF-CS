server {
    listen 80;
    server_name __PUBLIC_IP__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 301 https://__PUBLIC_IP__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __PUBLIC_IP__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gduf-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gduf-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 5m;
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
